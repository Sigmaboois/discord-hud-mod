name: Unpack source

on:
  push:
    branches: [ main ]
    paths:
      - '.source-part-*.b64'
      - '.github/workflows/unpack-source.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild source archive
        shell: bash
        run: |
          cat .source-part-1.b64 .source-part-2.b64 .source-part-3.b64 .source-part-4.b64 | base64 --decode > /tmp/discord-source.zip
          unzip -t /tmp/discord-source.zip
          unzip -o /tmp/discord-source.zip -d .
          rm -f .source-part-1.b64 .source-part-2.b64 .source-part-3.b64 .source-part-4.b64
          rm -f .github/workflows/unpack-source.yml

      - name: Commit extracted source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Unpack Discord HUD source"
          git push
